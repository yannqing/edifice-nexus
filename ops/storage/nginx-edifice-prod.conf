# Install as /etc/nginx/sites-available/edifice-prod.conf after backing up the live file.
server {
    listen 80;
    listen [::]:80;
    server_name nxrex-edifice.yannqing.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nxrex-edifice.yannqing.com;
    # File policy is exactly 5GiB; allow additional multipart framing at the gateway.
    client_max_body_size 5130m;
    client_body_timeout 900s;
    send_timeout 900s;
    ssl_certificate /etc/letsencrypt/live/nxrex-edifice.yannqing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nxrex-edifice.yannqing.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    access_log /var/log/nginx/edifice-prod-access.log;
    error_log /var/log/nginx/edifice-prod-error.log;
    include /etc/nginx/snippets/edifice-private-upload.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8181/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 900s;
    }
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
