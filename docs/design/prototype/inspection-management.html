                                            <td className="py-4 px-6 text-right">
                                                <div className="flex items-center justify-end gap-1">
                                                    <button className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="查看详情">
                                                        <Icon name="eye" className="w-4 h-4" />
                                                    </button>
                                                    {item.status === '已驳回' && (
                                                        <button className="p-1.5 text-slate-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors" title="重新提交">
                                                            <Icon name="refresh-cw" className="w-4 h-4" />
                                                        </button>
                                                    )}
                                                    {(item.status === '待初审' || item.status === '待终审') && (
                                                        <button className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="撤回">
                                                            <Icon name="undo-2" className="w-4 h-4" />
                                                        </button>
                                                    )}
                                                    <button className="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" title="更多">
                                                        <Icon name="more-horizontal" className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>

                            {/* 空状态 */}
                            {filteredInspections.length === 0 && (
                                <div className="py-16 text-center">
                                    <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <Icon name="file-text" className="w-8 h-8 text-slate-400" />
                                    </div>
                                    <h3 className="text-lg font-semibold text-slate-800 mb-2">暂无验工单</h3>
                                    <p className="text-sm text-slate-500 mb-4">当前筛选条件下没有找到验工单</p>
                                    <button
                                        onClick={() => { setActiveTab('all'); setSelectedCategory('all'); setSearchText(''); }}
                                        className="px-4 py-2 text-sm text-blue-600 font-medium hover:bg-blue-50 rounded-lg transition-colors"
                                    >
                                        清除筛选条件
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* 分页 */}
                        {filteredInspections.length > 0 && (
                            <div className="flex justify-between items-center pt-2">
                                <p className="text-sm text-slate-500">
                                    共 <span className="font-semibold text-slate-800">{filteredInspections.length}</span> 条记录
                                </p>
                                <div className="flex items-center gap-2">
                                    <button className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors disabled:opacity-50" disabled>
                                        <Icon name="chevron-left" className="w-4 h-4" />
                                    </button>
                                    <button className="px-3 py-1.5 text-sm font-medium bg-blue-600 text-white rounded-lg">1</button>
                                    <button className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                                        <Icon name="chevron-right" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 发起验工弹窗 */}
                    {showCreateModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-8">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
                                {/* 弹窗头部 */}
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                    <h2 className="text-xl font-bold text-slate-900">发起验工申请</h2>
                                    <button
                                        onClick={() => setShowCreateModal(false)}
                                        className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors"
                                    >
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                {/* 表单内容 */}
                                <div className="p-6 space-y-5">
                                    {/* 选择项目 */}
                                    <div>
                                        <label className="text-sm font-medium text-slate-700 mb-2 block">选择项目 <span className="text-rose-500">*</span></label>
                                        <select
                                            value={selectedProject}
                                            onChange={(e) => setSelectedProject(e.target.value)}
                                            className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white"
                                        >
                                            <option value="">请选择项目</option>
                                            {projectOptions.map(p => (
                                                <option key={p.id} value={p.id}>{p.name} ({p.code}) - {p.category}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* 选择阶段 */}
                                    <div>
                                        <label className="text-sm font-medium text-slate-700 mb-2 block">验工阶段 <span className="text-rose-500">*</span></label>
                                        <select
                                            className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white"
                                            disabled={!selectedProject}
                                        >
                                            <option value="">请先选择项目</option>
                                            {selectedProject && projectOptions.find(p => p.id === parseInt(selectedProject))?.availablePhases.map((phase, idx) => (
                                                <option key={idx} value={phase.phase}>{phase.phase} · {phase.name} (产值比例 {phase.ratio})</option>
                                            ))}
                                        </select>
                                        <p className="text-xs text-slate-400 mt-1">只能选择当前可验工的阶段（按阶段顺序）</p>
                                    </div>

                                    {/* 验工说明 */}
                                    <div>
                                        <label className="text-sm font-medium text-slate-700 mb-2 block">验工说明 <span className="text-rose-500">*</span></label>
                                        <textarea
                                            rows="4"
                                            placeholder="请描述本阶段完成的主要工作内容..."
                                            className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                                        ></textarea>
                                    </div>

                                    {/* 上传验收材料 */}
                                    <div>
                                        <label className="text-sm font-medium text-slate-700 mb-2 block">验收材料 <span className="text-rose-500">*</span></label>
                                        <div className="border-2 border-dashed border-slate-200 rounded-xl p-8 text-center hover:border-blue-400 transition-colors cursor-pointer">
                                            <div className="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                                <Icon name="upload-cloud" className="w-6 h-6 text-slate-400" />
                                            </div>
                                            <p className="text-sm text-slate-600 mb-1">点击或拖拽文件到此处上传</p>
                                            <p className="text-xs text-slate-400">支持 PDF、Word、Excel 等格式，单个文件不超过 20MB</p>
                                        </div>
                                        <p className="text-xs text-slate-400 mt-2">请上传：台账、计算底稿、成果文件等验收材料</p>
                                    </div>
                                </div>

                                {/* 弹窗底部 */}
                                <div className="p-6 border-t border-slate-100 flex justify-end gap-3">
                                    <button
                                        onClick={() => setShowCreateModal(false)}
                                        className="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors"
                                    >
                                        取消
                                    </button>
                                    <button className="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
                                        保存草稿
                                    </button>
                                    <button className="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors flex items-center gap-2">
                                        <Icon name="send" className="w-4 h-4" /> 提交验工
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
