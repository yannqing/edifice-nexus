                    case '管理工作': return 'bg-blue-500';
                    case '基础工作': return 'bg-emerald-500';
                    case '智励工作': return 'bg-amber-500';

                                        <th className="text-left py-4 px-4 font-semibold">分配明细</th>
                                        <th className="text-center py-4 px-4 font-semibold">状态</th>
                                        <th className="text-right py-4 px-6 font-semibold">操作</th>

                                                <p className="text-sm font-semibold text-slate-800">{item.projectName}</p>

                                                </p>

                                                    </button>
                                                    {item.status === '待确认' && (
                                                        <button className="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition-colors" title="确认分配">
                                                            <Icon name="check" className="w-4 h-4" />
                                                        </button>
                                                    )}
                                                    {item.status === '待审核' && (
                                                        <button className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="审批">
                                                            <Icon name="check-square" className="w-4 h-4" />
                                                        </button>
                                                    )}
                                                    <button className="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" title="更多">
                                                        <Icon name="more-horizontal" className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>

                            {/* 空状态 */}
                            {filteredAllocations.length === 0 && (
                                <div className="py-16 text-center">
                                    <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <Icon name="coins" className="w-8 h-8 text-slate-400" />
                                    </div>
                                    <h3 className="text-lg font-semibold text-slate-800 mb-2">暂无分配记录</h3>
                                    <p className="text-sm text-slate-500">当前筛选条件下没有找到产值分配记录</p>
                                </div>
                            )}
                        </div>

                        {/* 分页 */}
                        {filteredAllocations.length > 0 && (
                            <div className="flex justify-between items-center pt-2">
                                <p className="text-sm text-slate-500">
                                    共 <span className="font-semibold text-slate-800">{filteredAllocations.length}</span> 条记录
                                </p>
                                <div className="flex items-center gap-2">
                                    <button className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors disabled:opacity-50" disabled>
                                        <Icon name="chevron-left" className="w-4 h-4" />
                                    </button>
                                    <button className="px-3 py-1.5 text-sm font-medium bg-blue-600 text-white rounded-lg">1</button>
                                    <button className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                                        <Icon name="chevron-right" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 详情弹窗 */}
                    {showDetailModal && selectedAllocation && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-8">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col">
                                {/* 弹窗头部 */}
                                <div className="p-6 border-b border-slate-100 flex justify-between items-start">
                                    <div>
                                        <div className="flex items-center gap-3 mb-2">
                                            <h2 className="text-xl font-bold text-slate-900">产值分配详情</h2>
                                            <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${getStatusStyle(selectedAllocation.status)}`}>
                                                {selectedAllocation.status}
                                            </span>
                                        </div>
                                        <p className="text-sm text-slate-500">{selectedAllocation.projectName} · {selectedAllocation.phase} {selectedAllocation.phaseName}</p>
                                    </div>
                                    <button
                                        onClick={() => setShowDetailModal(false)}
                                        className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors"
                                    >
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                {/* 弹窗内容 */}
                                <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                    {/* 产值概览 */}
                                    <div className="grid grid-cols-3 gap-4">
                                        <div className="p-4 bg-slate-50 rounded-xl text-center">
                                            <p className="text-xs text-slate-500 mb-1">阶段产值</p>
                                            <p className="text-xl font-bold text-slate-800">￥{selectedAllocation.phaseAmount.toLocaleString()}</p>
                                            <p className="text-xs text-slate-400 mt-1">比例 {selectedAllocation.phaseRatio}</p>
                                        </div>
                                        <div className="p-4 bg-slate-50 rounded-xl text-center">
                                            <p className="text-xs text-slate-500 mb-1">回款系数</p>
                                            <p className={`text-xl font-bold ${
                                                selectedAllocation.collectionRatio >= 80 ? 'text-emerald-600' :
                                                selectedAllocation.collectionRatio >= 50 ? 'text-amber-600' : 'text-rose-600'
                                            }`}>{selectedAllocation.collectionRatio}%</p>
                                            <p className="text-xs text-slate-400 mt-1">基于回款状态</p>
                                        </div>
                                        <div className="p-4 bg-blue-50 rounded-xl text-center">
                                            <p className="text-xs text-blue-600 mb-1">实发产值</p>
                                            <p className="text-xl font-bold text-blue-700">￥{selectedAllocation.actualAmount.toLocaleString()}</p>
                                            <p className="text-xs text-blue-500 mt-1">= 阶段产值 × 回款系数</p>
                                        </div>
                                    </div>

                                    {/* 分配明细 */}
                                    <div>
                                        <h3 className="text-sm font-semibold text-slate-800 mb-4">分配明细</h3>
                                        <div className="space-y-3">
                                            {selectedAllocation.distributions.map((d, idx) => (
                                                <div key={idx} className="flex items-center gap-4 p-4 bg-slate-50 rounded-xl">
                                                    <div className={`w-1 h-12 rounded-full ${getWorkTypeStyle(d.type)}`}></div>
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-2 mb-1">
                                                            <span className={`text-xs px-2 py-0.5 rounded font-medium ${
                                                                d.type === '管理工作' ? 'bg-blue-100 text-blue-600' :
                                                                d.type === '基础工作' ? 'bg-emerald-100 text-emerald-600' :
                                                                'bg-amber-100 text-amber-600'
                                                            }`}>{d.type}</span>
                                                            <span className="text-xs text-slate-400">比例 {d.ratio}%</span>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <div className="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-xs font-medium text-slate-600">
                                                                {d.person[0]}
                                                            </div>
                                                            <span className="text-sm text-slate-700">{d.person}</span>
                                                            <span className="text-xs text-slate-400">({d.role})</span>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="text-lg font-bold text-slate-800">￥{d.amount.toLocaleString()}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 审批流程 */}
                                    <div>
                                        <h3 className="text-sm font-semibold text-slate-800 mb-4">审批流程</h3>
                                        <div className="flex items-center gap-4">
                                            <div className="flex flex-col items-center">
                                                <div className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center">
                                                    <Icon name="check" className="w-5 h-5" />
                                                </div>
                                                <p className="text-xs text-slate-600 mt-2">系统生成</p>
                                                <p className="text-xs text-slate-400">{selectedAllocation.createTime.split(' ')[0]}</p>
                                            </div>
                                            <div className="flex-1 h-0.5 bg-slate-200"></div>
                                            <div className="flex flex-col items-center">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center ${
                                                    selectedAllocation.status === '待确认' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'
                                                }`}>
                                                    <Icon name={selectedAllocation.status === '待确认' ? 'clock' : 'check'} className="w-5 h-5" />
                                                </div>
                                                <p className="text-xs text-slate-600 mt-2">项目经理确认</p>
                                                <p className="text-xs text-slate-400">{selectedAllocation.status === '待确认' ? '待处理' : '已完成'}</p>
                                            </div>
                                            <div className="flex-1 h-0.5 bg-slate-200"></div>
                                            <div className="flex flex-col items-center">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center ${
                                                    selectedAllocation.status === '待审核' ? 'bg-blue-100 text-blue-600' :
                                                    selectedAllocation.status === '待确认' ? 'bg-slate-100 text-slate-400' : 'bg-emerald-100 text-emerald-600'
                                                }`}>
                                                    <Icon name={selectedAllocation.status === '待确认' || selectedAllocation.status === '待审核' ? 'clock' : 'check'} className="w-5 h-5" />
                                                </div>
                                                <p className="text-xs text-slate-600 mt-2">业务经理审核</p>
                                                <p className="text-xs text-slate-400">
                                                    {selectedAllocation.status === '待确认' ? '待前置' :
                                                     selectedAllocation.status === '待审核' ? '待处理' : '已完成'}
                                                </p>
                                            </div>
                                            <div className="flex-1 h-0.5 bg-slate-200"></div>
                                            <div className="flex flex-col items-center">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center ${
                                                    selectedAllocation.status === '已发放' ? 'bg-emerald-100 text-emerald-600' :
                                                    selectedAllocation.status === '已审批' ? 'bg-purple-100 text-purple-600' : 'bg-slate-100 text-slate-400'
                                                }`}>
                                                    <Icon name={selectedAllocation.status === '已发放' ? 'check' : 'banknote'} className="w-5 h-5" />
                                                </div>
                                                <p className="text-xs text-slate-600 mt-2">产值发放</p>
                                                <p className="text-xs text-slate-400">
                                                    {selectedAllocation.status === '已发放' ? selectedAllocation.paidTime?.split(' ')[0] : '待发放'}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* 弹窗底部 */}
                                <div className="p-6 border-t border-slate-100 flex justify-end gap-3">
                                    <button
                                        onClick={() => setShowDetailModal(false)}
                                        className="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors"
                                    >
                                        关闭
                                    </button>
                                    {selectedAllocation.status === '待确认' && (
                                        <>
                                            <button className="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
                                                调整分配
                                            </button>
                                            <button className="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors">
                                                确认分配
                                            </button>
                                        </>
                                    )}
                                    {selectedAllocation.status === '待审核' && (
                                        <>
                                            <button className="px-4 py-2 text-sm font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl transition-colors">
                                                驳回
                                            </button>
                                            <button className="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl transition-colors">
                                                审批通过
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
