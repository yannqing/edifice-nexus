<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回款管理 - 项目产值分配核算管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            background-color: #F8FAFC;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sidebar-item-active {
            background: #EFF6FF;
            color: #2563EB;
            border-right: 4px solid #2563EB;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 模拟图标组件封装
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('all');
            const [searchText, setSearchText] = useState('');
            const [showDetailModal, setShowDetailModal] = useState(false);
            const [showAddModal, setShowAddModal] = useState(false);
            const [selectedProject, setSelectedProject] = useState(null);

            // 回款数据（来自实际Excel数据）
            const collections = [
                {
                    id: 1,
                    projectName: '国家电投通辽智慧热电项目',
                    projectCode: 'PJ2024-004',
                    category: 'A类',
                    contractAmount: 1400000,
                    completedPhases: '1-3',
                    expectedAmount: 980000,
                    collectedAmount: 725200,
                    collectionRate: 74,
                    status: '部分回款',
                    manager: '朱勇',
                    records: [
                        { id: 1, phase: '阶段1', planAmount: 70000, planDate: '2024-01-20', actualAmount: 70000, actualDate: '2024-01-18', voucher: '已上传' },
                        { id: 2, phase: '阶段2', planAmount: 630000, planDate: '2024-02-15', actualAmount: 530000, actualDate: '2024-02-20', voucher: '已上传' },
                        { id: 3, phase: '阶段3', planAmount: 280000, planDate: '2024-03-10', actualAmount: 125200, actualDate: '2024-03-05', voucher: '已上传' },
                    ]
                },
                {
                    id: 2,
                    projectName: '三峡能源哈密光热项目',
                    projectCode: 'PJ2024-007',
                    category: 'B类',
                    contractAmount: 500000,
                    completedPhases: '1-2',
                    expectedAmount: 200000,
                    collectedAmount: 130000,
                    collectionRate: 65,
                    status: '部分回款',
                    manager: '张鑫',
                    records: [
                        { id: 1, phase: '阶段1', planAmount: 25000, planDate: '2024-02-01', actualAmount: 25000, actualDate: '2024-01-28', voucher: '已上传' },
                        { id: 2, phase: '阶段2', planAmount: 175000, planDate: '2024-03-01', actualAmount: 105000, actualDate: '2024-02-28', voucher: '已上传' },
                    ]
                },
                {
                    id: 3,
                    projectName: '大坝电厂项目',
                    projectCode: 'PJ2024-013',
                    category: 'D类',
                    contractAmount: 85000,
                    completedPhases: '1',
                    expectedAmount: 12750,
                    collectedAmount: 0,
                    collectionRate: 0,
                    status: '未回款',
                    manager: '赵华',
                    records: [
                        { id: 1, phase: '阶段1', planAmount: 12750, planDate: '2024-03-20', actualAmount: 0, actualDate: null, voucher: '未上传' },
                    ]
                },
                {
                    id: 4,
                    projectName: '内蒙杭锦旗供热管网项目',
                    projectCode: 'PJ2024-003',
                    category: 'B类',
                    contractAmount: 260000,
                    completedPhases: '1-4',
                    expectedAmount: 234000,
                    collectedAmount: 198900,
                    collectionRate: 85,
                    status: '部分回款',
                    manager: '付雪梅',
                    records: [
                        { id: 1, phase: '阶段1', planAmount: 13000, planDate: '2023-11-15', actualAmount: 13000, actualDate: '2023-11-12', voucher: '已上传' },
                        { id: 2, phase: '阶段2', planAmount: 117000, planDate: '2023-12-20', actualAmount: 117000, actualDate: '2023-12-18', voucher: '已上传' },
                        { id: 3, phase: '阶段3', planAmount: 52000, planDate: '2024-01-25', actualAmount: 52000, actualDate: '2024-01-22', voucher: '已上传' },
                        { id: 4, phase: '阶段4', planAmount: 52000, planDate: '2024-02-28', actualAmount: 16900, actualDate: '2024-03-01', voucher: '已上传' },
                    ]
                },
                {
                    id: 5,
                    projectName: '中国石化长城能化330kV变电站',
                    projectCode: 'PJ2024-009',
                    category: 'C类',
                    contractAmount: 120000,
                    completedPhases: '1-3',
                    expectedAmount: 120000,
                    collectedAmount: 120000,
                    collectionRate: 100,
                    status: '已回款',
                    manager: '王强',
                    records: [
                        { id: 1, phase: '阶段1', planAmount: 12000, planDate: '2023-10-20', actualAmount: 12000, actualDate: '2023-10-18', voucher: '已上传' },
                        { id: 2, phase: '阶段2', planAmount: 96000, planDate: '2023-12-15', actualAmount: 96000, actualDate: '2023-12-10', voucher: '已上传' },
                        { id: 3, phase: '阶段3', planAmount: 12000, planDate: '2024-01-30', actualAmount: 12000, actualDate: '2024-01-28', voucher: '已上传' },
                    ]
                },
                {
                    id: 6,
                    projectName: '宁夏电投永利新能源光伏',
                    projectCode: 'PJ2024-014',
                    category: 'B类',
                    contractAmount: 680000,
                    completedPhases: '-',
                    expectedAmount: 0,
                    collectedAmount: 0,
                    collectionRate: 0,
                    status: '未回款',
                    manager: '张鑫',
                    records: []
                },
            ];

            // 统计数据
            const totalExpected = collections.reduce((sum, c) => sum + c.expectedAmount, 0);
            const totalCollected = collections.reduce((sum, c) => sum + c.collectedAmount, 0);
            const totalContract = collections.reduce((sum, c) => sum + c.contractAmount, 0);
            const overdueAmount = collections
                .filter(c => c.status === '未回款' || c.status === '部分回款')
                .reduce((sum, c) => sum + (c.expectedAmount - c.collectedAmount), 0);

            const stats = [
                { label: '应收款总额', value: `￥${(totalExpected / 10000).toFixed(1)}万`, icon: 'banknote', color: 'text-blue-600', bgColor: 'bg-blue-50' },
                { label: '已回款金额', value: `￥${(totalCollected / 10000).toFixed(1)}万`, icon: 'check-circle', color: 'text-emerald-600', bgColor: 'bg-emerald-50' },
                { label: '整体回款率', value: `${((totalCollected / totalExpected) * 100).toFixed(1)}%`, icon: 'pie-chart', color: 'text-amber-600', bgColor: 'bg-amber-50' },
                { label: '待回款金额', value: `￥${((totalExpected - totalCollected) / 10000).toFixed(1)}万`, icon: 'clock', color: 'text-rose-600', bgColor: 'bg-rose-50' },
            ];

            const tabs = [
                { key: 'all', label: '全部', count: collections.length },
                { key: 'collected', label: '已回款', count: collections.filter(c => c.status === '已回款').length },
                { key: 'partial', label: '部分回款', count: collections.filter(c => c.status === '部分回款').length },
                { key: 'uncollected', label: '未回款', count: collections.filter(c => c.status === '未回款').length },
            ];

            const filteredCollections = collections.filter(c => {
                const matchTab = activeTab === 'all' ||
                    (activeTab === 'collected' && c.status === '已回款') ||
                    (activeTab === 'partial' && c.status === '部分回款') ||
                    (activeTab === 'uncollected' && c.status === '未回款');
                const matchSearch = c.projectName.includes(searchText) || c.projectCode.includes(searchText);
                return matchTab && matchSearch;
            });

            const getStatusStyle = (status) => {
                switch (status) {
                    case '已回款': return 'bg-emerald-100 text-emerald-700';
                    case '部分回款': return 'bg-amber-100 text-amber-700';
                    case '未回款': return 'bg-rose-100 text-rose-700';
                    default: return 'bg-slate-100 text-slate-700';
                }
            };

            const getRateColor = (rate) => {
                if (rate >= 100) return 'text-emerald-600';
                if (rate >= 50) return 'text-amber-600';
                return 'text-rose-600';
            };

            const openDetail = (collection) => {
                setSelectedProject(collection);
                setShowDetailModal(true);
            };

            return (
                <div className="flex min-h-screen">
                    {/* 左侧导航栏 */}
                    <aside className="w-64 bg-white border-r border-slate-200 flex flex-col sticky top-0 h-screen">
                        <div className="p-6 flex items-center gap-3">
                            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">R</div>
                            <span className="font-bold text-slate-800 text-lg tracking-tight">然而信工程管理</span>
                        </div>

                        <nav className="flex-1 px-4 space-y-1 mt-4 overflow-y-auto">
                            <a href="index.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="layout-dashboard" /> <span className="font-medium text-sm text-slate-600">工作台</span>
                            </a>

                            {/* 日常工作 */}
                            <div className="text-xs text-slate-400 px-4 pt-4 pb-2 uppercase tracking-wider font-semibold">日常工作</div>
                            <a href="my-projects.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="folder-open" /> <span className="font-medium text-sm text-slate-600">我的项目</span>
                            </a>
                            <a href="inspection-approval.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="clipboard-check" /> <span className="font-medium text-sm text-slate-600">验工审批</span>
                                <span className="ml-auto text-xs bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full font-semibold">3</span>
                            </a>
                            <a href="timesheet.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="clock" /> <span className="font-medium text-sm text-slate-600">工时填报</span>
                            </a>

                            {/* 项目管理 */}
                            <div className="text-xs text-slate-400 px-4 pt-4 pb-2 uppercase tracking-wider font-semibold">项目管理</div>
                            <a href="all-projects.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="briefcase" /> <span className="font-medium text-sm text-slate-600">全部项目</span>
                            </a>
                            <a href="inspection-management.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="file-text" /> <span className="font-medium text-sm text-slate-600">验工单管理</span>
                            </a>

                            {/* 财务管理 */}
                            <div className="text-xs text-slate-400 px-4 pt-4 pb-2 uppercase tracking-wider font-semibold">财务管理</div>
                            <a href="output-value.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="coins" /> <span className="font-medium text-sm text-slate-600">产值分配</span>
                            </a>
                            <div className="sidebar-item-active flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer transition-all">
                                <Icon name="wallet" /> <span className="font-medium text-sm">回款管理</span>
                            </div>

                            {/* 报表统计 */}
                            <div className="text-xs text-slate-400 px-4 pt-4 pb-2 uppercase tracking-wider font-semibold">报表统计</div>
                            <a href="statistics.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="bar-chart-3" /> <span className="font-medium text-sm text-slate-600">统计报表</span>
                            </a>
                            <a href="performance.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="user-circle" /> <span className="font-medium text-sm text-slate-600">个人绩效</span>
                            </a>
                        </nav>

                        <div className="p-4 border-t border-slate-100 mt-auto">
                            <div className="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-xl cursor-pointer">
                                <div className="w-10 h-10 bg-slate-200 rounded-full overflow-hidden">
                                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="avatar" />
                                </div>
                                <div className="flex-1 overflow-hidden">
                                    <p className="text-sm font-semibold text-slate-800 truncate">陈经理</p>
                                    <p className="text-xs text-slate-400 truncate">管理员</p>
                                </div>
                                <Icon name="chevron-down" className="w-4 h-4 text-slate-400" />
                            </div>
                        </div>
                    </aside>

                    {/* 主内容区 */}
                    <main className="flex-1 p-8">
                        {/* 顶部标题和操作 */}
                        <div className="flex items-center justify-between mb-8">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800 mb-1">回款管理</h1>
                                <p className="text-slate-500 text-sm">管理项目回款计划与实际回款记录</p>
                            </div>
                            <button
                                onClick={() => setShowAddModal(true)}
                                className="px-4 py-2.5 bg-blue-600 text-white rounded-xl font-medium flex items-center gap-2 hover:bg-blue-700 transition-colors"
                            >
                                <Icon name="plus" className="w-4 h-4" /> 录入回款
                            </button>
                        </div>

                        {/* 统计卡片 */}
                        <div className="grid grid-cols-4 gap-6 mb-8">
                            {stats.map((stat, idx) => (
                                <div key={idx} className="glass-card rounded-2xl p-5 shadow-sm">
                                    <div className="flex items-center justify-between mb-3">
                                        <div className={`w-10 h-10 ${stat.bgColor} rounded-xl flex items-center justify-center`}>
                                            <Icon name={stat.icon} className={`w-5 h-5 ${stat.color}`} />
                                        </div>
                                    </div>
                                    <p className="text-2xl font-bold text-slate-800">{stat.value}</p>
                                    <p className="text-slate-500 text-sm mt-1">{stat.label}</p>
                                </div>
                            ))}
                        </div>

                        {/* 筛选和搜索 */}
                        <div className="glass-card rounded-2xl p-6 shadow-sm mb-6">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    {tabs.map(tab => (
                                        <button
                                            key={tab.key}
                                            onClick={() => setActiveTab(tab.key)}
                                            className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                                                activeTab === tab.key
                                                    ? 'bg-blue-600 text-white'
                                                    : 'text-slate-600 hover:bg-slate-100'
                                            }`}
                                        >
                                            {tab.label}
                                            <span className={`ml-1.5 px-1.5 py-0.5 rounded text-xs ${
                                                activeTab === tab.key ? 'bg-blue-500' : 'bg-slate-200'
                                            }`}>
                                                {tab.count}
                                            </span>
                                        </button>
                                    ))}
                                </div>
                                <div className="relative">
                                    <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                                    <input
                                        type="text"
                                        placeholder="搜索项目名称或编号..."
                                        value={searchText}
                                        onChange={(e) => setSearchText(e.target.value)}
                                        className="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* 回款列表 */}
                        <div className="glass-card rounded-2xl shadow-sm overflow-hidden">
                            <table className="w-full">
                                <thead className="bg-slate-50 border-b border-slate-100">
                                    <tr>
                                        <th className="text-left py-4 px-6 text-sm font-semibold text-slate-600">项目信息</th>
                                        <th className="text-left py-4 px-4 text-sm font-semibold text-slate-600">合同金额</th>
                                        <th className="text-left py-4 px-4 text-sm font-semibold text-slate-600">已完成阶段</th>
                                        <th className="text-left py-4 px-4 text-sm font-semibold text-slate-600">应收金额</th>
                                        <th className="text-left py-4 px-4 text-sm font-semibold text-slate-600">已回款金额</th>
                                        <th className="text-left py-4 px-4 text-sm font-semibold text-slate-600">回款率</th>
                                        <th className="text-left py-4 px-4 text-sm font-semibold text-slate-600">状态</th>
                                        <th className="text-center py-4 px-4 text-sm font-semibold text-slate-600">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredCollections.map((item) => (
                                        <tr key={item.id} className="border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
                                            <td className="py-4 px-6">
                                                <div className="font-medium text-slate-800">{item.projectName}</div>
                                                <div className="text-xs text-slate-400 mt-0.5">{item.projectCode} · {item.category} · {item.manager}</div>
                                            </td>
                                            <td className="py-4 px-4">
                                                <span className="text-slate-700">￥{item.contractAmount.toLocaleString()}</span>
                                            </td>
                                            <td className="py-4 px-4">
                                                <span className="text-slate-600">{item.completedPhases}</span>
                                            </td>
                                            <td className="py-4 px-4">
                                                <span className="font-medium text-slate-800">￥{item.expectedAmount.toLocaleString()}</span>
                                            </td>
                                            <td className="py-4 px-4">
                                                <span className="font-medium text-emerald-600">￥{item.collectedAmount.toLocaleString()}</span>
                                            </td>
                                            <td className="py-4 px-4">
                                                <div className="flex items-center gap-2">
                                                    <div className="w-16 h-2 bg-slate-200 rounded-full overflow-hidden">
                                                        <div
                                                            className={`h-full rounded-full ${
                                                                item.collectionRate >= 100 ? 'bg-emerald-500' :
                                                                item.collectionRate >= 50 ? 'bg-amber-500' : 'bg-rose-500'
                                                            }`}
                                                            style={{ width: `${Math.min(item.collectionRate, 100)}%` }}
                                                        />
                                                    </div>
                                                    <span className={`text-sm font-medium ${getRateColor(item.collectionRate)}`}>
                                                        {item.collectionRate}%
                                                    </span>
                                                </div>
                                            </td>
                                            <td className="py-4 px-4">
                                                <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${getStatusStyle(item.status)}`}>
                                                    {item.status}
                                                </span>
                                            </td>
                                            <td className="py-4 px-4 text-center">
                                                <button
                                                    onClick={() => openDetail(item)}
                                                    className="text-blue-600 hover:text-blue-700 text-sm font-medium"
                                                >
                                                    查看详情
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </main>

                    {/* 详情弹窗 */}
                    {showDetailModal && selectedProject && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
                                <div className="p-6 border-b border-slate-100 flex items-center justify-between">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-800">回款详情</h2>
                                        <p className="text-slate-500 text-sm mt-1">{selectedProject.projectName}</p>
                                    </div>
                                    <button onClick={() => setShowDetailModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-6 h-6" />
                                    </button>
                                </div>

                                <div className="p-6 overflow-y-auto flex-1">
                                    {/* 项目概况 */}
                                    <div className="grid grid-cols-4 gap-4 mb-6">
                                        <div className="bg-slate-50 rounded-xl p-4">
                                            <p className="text-slate-500 text-sm">合同金额</p>
                                            <p className="text-xl font-bold text-slate-800 mt-1">￥{selectedProject.contractAmount.toLocaleString()}</p>
                                        </div>
                                        <div className="bg-blue-50 rounded-xl p-4">
                                            <p className="text-blue-600 text-sm">应收金额</p>
                                            <p className="text-xl font-bold text-blue-700 mt-1">￥{selectedProject.expectedAmount.toLocaleString()}</p>
                                        </div>
                                        <div className="bg-emerald-50 rounded-xl p-4">
                                            <p className="text-emerald-600 text-sm">已回款金额</p>
                                            <p className="text-xl font-bold text-emerald-700 mt-1">￥{selectedProject.collectedAmount.toLocaleString()}</p>
                                        </div>
                                        <div className="bg-amber-50 rounded-xl p-4">
                                            <p className="text-amber-600 text-sm">回款率</p>
                                            <p className="text-xl font-bold text-amber-700 mt-1">{selectedProject.collectionRate}%</p>
                                        </div>
                                    </div>

                                    {/* 回款进度 */}
                                    <div className="mb-6">
                                        <h3 className="text-sm font-semibold text-slate-700 mb-3">回款进度</h3>
                                        <div className="h-4 bg-slate-100 rounded-full overflow-hidden">
                                            <div
                                                className={`h-full rounded-full transition-all ${
                                                    selectedProject.collectionRate >= 100 ? 'bg-emerald-500' :
                                                    selectedProject.collectionRate >= 50 ? 'bg-amber-500' : 'bg-rose-500'
                                                }`}
                                                style={{ width: `${Math.min(selectedProject.collectionRate, 100)}%` }}
                                            />
                                        </div>
                                        <div className="flex justify-between mt-2 text-sm text-slate-500">
                                            <span>已回款 ￥{selectedProject.collectedAmount.toLocaleString()}</span>
                                            <span>待回款 ￥{(selectedProject.expectedAmount - selectedProject.collectedAmount).toLocaleString()}</span>
                                        </div>
                                    </div>

                                    {/* 回款记录明细 */}
                                    <div>
                                        <div className="flex items-center justify-between mb-3">
                                            <h3 className="text-sm font-semibold text-slate-700">回款记录明细</h3>
                                            <button className="text-blue-600 text-sm font-medium flex items-center gap-1 hover:text-blue-700">
                                                <Icon name="plus" className="w-4 h-4" /> 新增回款记录
                                            </button>
                                        </div>

                                        {selectedProject.records.length > 0 ? (
                                            <table className="w-full">
                                                <thead className="bg-slate-50">
                                                    <tr>
                                                        <th className="text-left py-3 px-4 text-sm font-medium text-slate-600">阶段</th>
                                                        <th className="text-left py-3 px-4 text-sm font-medium text-slate-600">计划回款</th>
                                                        <th className="text-left py-3 px-4 text-sm font-medium text-slate-600">计划日期</th>
                                                        <th className="text-left py-3 px-4 text-sm font-medium text-slate-600">实际回款</th>
                                                        <th className="text-left py-3 px-4 text-sm font-medium text-slate-600">实际日期</th>
                                                        <th className="text-left py-3 px-4 text-sm font-medium text-slate-600">凭证</th>
                                                        <th className="text-center py-3 px-4 text-sm font-medium text-slate-600">状态</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {selectedProject.records.map((record) => (
                                                        <tr key={record.id} className="border-b border-slate-100">
                                                            <td className="py-3 px-4 text-sm text-slate-700">{record.phase}</td>
                                                            <td className="py-3 px-4 text-sm text-slate-700">￥{record.planAmount.toLocaleString()}</td>
                                                            <td className="py-3 px-4 text-sm text-slate-500">{record.planDate}</td>
                                                            <td className="py-3 px-4 text-sm font-medium text-emerald-600">
                                                                ￥{record.actualAmount.toLocaleString()}
                                                            </td>
                                                            <td className="py-3 px-4 text-sm text-slate-500">
                                                                {record.actualDate || '-'}
                                                            </td>
                                                            <td className="py-3 px-4">
                                                                {record.voucher === '已上传' ? (
                                                                    <span className="text-blue-600 text-sm cursor-pointer hover:underline">
                                                                        查看凭证
                                                                    </span>
                                                                ) : (
                                                                    <span className="text-slate-400 text-sm">未上传</span>
                                                                )}
                                                            </td>
                                                            <td className="py-3 px-4 text-center">
                                                                {record.actualAmount >= record.planAmount ? (
                                                                    <span className="inline-flex items-center gap-1 text-emerald-600 text-sm">
                                                                        <Icon name="check-circle" className="w-4 h-4" /> 已完成
                                                                    </span>
                                                                ) : record.actualAmount > 0 ? (
                                                                    <span className="inline-flex items-center gap-1 text-amber-600 text-sm">
                                                                        <Icon name="clock" className="w-4 h-4" /> 部分回款
                                                                    </span>
                                                                ) : (
                                                                    <span className="inline-flex items-center gap-1 text-rose-600 text-sm">
                                                                        <Icon name="alert-circle" className="w-4 h-4" /> 待回款
                                                                    </span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        ) : (
                                            <div className="text-center py-8 text-slate-400">
                                                <Icon name="inbox" className="w-12 h-12 mx-auto mb-2" />
                                                <p>暂无回款记录</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="p-6 border-t border-slate-100 flex justify-end gap-3">
                                    <button
                                        onClick={() => setShowDetailModal(false)}
                                        className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors"
                                    >
                                        关闭
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 录入回款弹窗 */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl w-full max-w-lg overflow-hidden">
                                <div className="p-6 border-b border-slate-100 flex items-center justify-between">
                                    <h2 className="text-xl font-bold text-slate-800">录入回款</h2>
                                    <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-6 h-6" />
                                    </button>
                                </div>

                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1.5">选择项目 <span className="text-rose-500">*</span></label>
                                        <select className="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="">请选择项目</option>
                                            {collections.map(c => (
                                                <option key={c.id} value={c.id}>{c.projectName} ({c.projectCode})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1.5">回款阶段 <span className="text-rose-500">*</span></label>
                                        <select className="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="">请选择阶段</option>
                                            <option value="1">阶段1 - 方案计划编制</option>
                                            <option value="2">阶段2 - 初稿编制</option>
                                            <option value="3">阶段3 - 终稿编制</option>
                                            <option value="4">阶段4 - 核对</option>
                                            <option value="5">阶段5 - 后期配合</option>
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1.5">回款金额 <span className="text-rose-500">*</span></label>
                                            <input
                                                type="number"
                                                placeholder="请输入金额"
                                                className="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1.5">回款日期 <span className="text-rose-500">*</span></label>
                                            <input
                                                type="date"
                                                className="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1.5">上传凭证</label>
                                        <div className="border-2 border-dashed border-slate-200 rounded-lg p-6 text-center hover:border-blue-400 transition-colors cursor-pointer">
                                            <Icon name="upload-cloud" className="w-10 h-10 text-slate-300 mx-auto mb-2" />
                                            <p className="text-sm text-slate-500">点击或拖拽上传回款凭证</p>
                                            <p className="text-xs text-slate-400 mt-1">支持 JPG、PNG、PDF 格式</p>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1.5">备注</label>
                                        <textarea
                                            rows="2"
                                            placeholder="请输入备注信息（选填）"
                                            className="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                                        />
                                    </div>
                                </div>

                                <div className="p-6 border-t border-slate-100 flex justify-end gap-3">
                                    <button
                                        onClick={() => setShowAddModal(false)}
                                        className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors"
                                    >
                                        取消
                                    </button>
                                    <button className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors">
                                        确认提交
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
