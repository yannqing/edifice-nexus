                                                <div className="bg-blue-600" style={{ width: `${80 - idx * 10}%` }}></div>
                                                <div className="bg-emerald-400" style={{ width: '15%' }}></div>
                                            </div>
                                        </div>
                                    ))}
                                    <div className="p-4 bg-blue-50 rounded-xl mt-6">
                                        <div className="flex gap-3">
                                            <Icon name="zap" className="text-blue-600" />
                                            <div>
                                                <p className="text-sm font-bold text-blue-900">系统提示</p>
                                                <p className="text-xs text-blue-700 mt-1">当前有 2 个项目效益收费已达到修正阈值，建议及时调整预计效益。</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
