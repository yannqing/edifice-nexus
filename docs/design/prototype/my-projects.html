<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的项目 - 项目产值分配核算管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            background-color: #F8FAFC;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sidebar-item-active {
            background: #EFF6FF;
            color: #2563EB;
            border-right: 4px solid #2563EB;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 模拟图标组件封装
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [activeFilter, setActiveFilter] = useState('all');
            const [searchText, setSearchText] = useState('');

            // 我的项目数据（来自实际Excel数据）
            const myProjects = [
                {
                    id: 1,
                    name: '国家电投通辽智慧热电项目',
                    code: 'PJ2024-004',
                    category: 'A类',
                    categoryName: '全程结算',
                    contractAmount: 1400000,
                    phases: 5,
                    currentPhase: 4,
                    currentPhaseName: '核对',
                    status: '进行中',
                    startDate: '2024-01-15',
                    endDate: '2024-12-31',
                    members: ['朱勇', '付雪梅', '张鑫'],
                    progress: 74,
                    collection: 74
                },
                {
                    id: 2,
                    name: '三峡能源哈密光热项目',
                    code: 'PJ2024-007',
                    category: 'B类',
                    categoryName: '全过程',
                    contractAmount: 500000,
                    phases: 5,
                    currentPhase: 3,
                    currentPhaseName: '终稿编制',
                    status: '待验收',
                    startDate: '2024-02-01',
                    endDate: '2024-10-31',
                    members: ['张鑫', '李明', '王强'],
                    progress: 60,
                    collection: 65
                },
                {
                    id: 3,
                    name: '甘肃能化兰州新区热电项目',
                    code: 'PJ2024-008',
                    category: 'A类',
                    categoryName: '全程结算',
                    contractAmount: 380000,
                    phases: 5,
                    currentPhase: 2,
                    currentPhaseName: '初稿编制',
                    status: '进行中',
                    startDate: '2024-03-01',
                    endDate: '2024-09-30',
                    members: ['付雪梅', '刘伟'],
                    progress: 40,
                    collection: 50
                },
                {
                    id: 4,
                    name: '中国石化长城能化330kV变电站',
                    code: 'PJ2024-009',
                    category: 'C类',
                    categoryName: '单项',
                    contractAmount: 120000,
                    phases: 3,
                    currentPhase: 3,
                    currentPhaseName: '后期配合',
                    status: '已完成',
                    startDate: '2023-10-01',
                    endDate: '2024-02-28',
                    members: ['王强', '赵华'],
                    progress: 100,
                    collection: 100
                },
                {
                    id: 5,
                    name: '宁夏电投永利煤电工程',
                    code: 'PJ2024-012',
                    category: 'A类',
                    categoryName: '全程结算',
                    contractAmount: 1280000,
                    phases: 5,
                    currentPhase: 2,
                    currentPhaseName: '初稿编制',
                    status: '进行中',
                    startDate: '2024-04-01',
                    endDate: '2025-06-30',
                    members: ['付雪梅', '张鑫'],
                    progress: 45,
                    collection: 100
                },
                {
                    id: 6,
                    name: '内蒙杭锦旗供热管网项目',
                    code: 'PJ2024-003',
                    category: 'B类',
                    categoryName: '全过程',
                    contractAmount: 260000,
                    phases: 5,
                    currentPhase: 4,
                    currentPhaseName: '核对',
                    status: '进行中',
                    startDate: '2023-11-01',
                    endDate: '2024-08-31',
                    members: ['朱勇', '李明', '刘伟'],
                    progress: 80,
                    collection: 85
                },
            ];

            // 筛选统计
            const filterStats = {
                all: myProjects.length,
                inProgress: myProjects.filter(p => p.status === '进行中').length,
                pending: myProjects.filter(p => p.status === '待验收').length,
                completed: myProjects.filter(p => p.status === '已完成').length,
                notStarted: myProjects.filter(p => p.status === '未开始').length,
            };

            // 筛选后的项目
            const filteredProjects = myProjects.filter(p => {
                if (activeFilter === 'all') return true;
                if (activeFilter === 'inProgress') return p.status === '进行中';
                if (activeFilter === 'pending') return p.status === '待验收';
                if (activeFilter === 'completed') return p.status === '已完成';
                if (activeFilter === 'notStarted') return p.status === '未开始';
                return true;
            }).filter(p => {
                if (!searchText) return true;
                return p.name.includes(searchText) || p.code.includes(searchText);
            });

            // 状态颜色映射
            const getStatusStyle = (status) => {
                switch(status) {
                    case '进行中': return 'bg-blue-100 text-blue-600';
                    case '待验收': return 'bg-amber-100 text-amber-600';
                    case '已完成': return 'bg-emerald-100 text-emerald-600';
                    case '未开始': return 'bg-slate-100 text-slate-500';
                    default: return 'bg-slate-100 text-slate-500';
                }
            };

            // 分类颜色映射
            const getCategoryStyle = (category) => {
                switch(category) {
                    case 'A类': return 'bg-blue-50 text-blue-600 border-blue-200';
                    case 'B类': return 'bg-emerald-50 text-emerald-600 border-emerald-200';
                    case 'C类': return 'bg-amber-50 text-amber-600 border-amber-200';
                    case 'D类': return 'bg-purple-50 text-purple-600 border-purple-200';
                    case 'E类': return 'bg-rose-50 text-rose-600 border-rose-200';
                    default: return 'bg-slate-50 text-slate-600 border-slate-200';
                }
            };

            return (
                <div className="flex min-h-screen">
                    {/* 左侧导航栏 */}
                    <aside className="w-64 bg-white border-r border-slate-200 flex flex-col sticky top-0 h-screen">
                        <div className="p-6 flex items-center gap-3">
                            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">R</div>
                            <span className="font-bold text-slate-800 text-lg tracking-tight">然而信工程管理</span>
                        </div>

                        <nav className="flex-1 px-4 space-y-1 mt-4 overflow-y-auto">
                            <a href="index.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="layout-dashboard" /> <span className="font-medium text-sm text-slate-600">工作台</span>
                            </a>

                            {/* 日常工作 */}
                            <div className="text-xs text-slate-400 px-4 pt-4 pb-2 uppercase tracking-wider font-semibold">日常工作</div>
                            <div className="sidebar-item-active flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer transition-all">
                                <Icon name="folder-open" /> <span className="font-medium text-sm">我的项目</span>
                            </div>
                            <a href="inspection-approval.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="clipboard-check" /> <span className="font-medium text-sm text-slate-600">验工审批</span>
                                <span className="ml-auto text-xs bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full font-semibold">3</span>
                            </a>
                            <a href="timesheet.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="clock" /> <span className="font-medium text-sm text-slate-600">工时填报</span>
                            </a>

                            {/* 项目管理 */}
                            <div className="text-xs text-slate-400 px-4 pt-4 pb-2 uppercase tracking-wider font-semibold">项目管理</div>
                            <a href="all-projects.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="briefcase" /> <span className="font-medium text-sm text-slate-600">全部项目</span>
                            </a>
                            <a href="inspection-management.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="file-text" /> <span className="font-medium text-sm text-slate-600">验工单管理</span>
                            </a>

                            {/* 财务管理 */}
                            <div className="text-xs text-slate-400 px-4 pt-4 pb-2 uppercase tracking-wider font-semibold">财务管理</div>
                            <a href="output-value.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="coins" /> <span className="font-medium text-sm text-slate-600">产值分配</span>
                            </a>
                            <a href="collection.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="wallet" /> <span className="font-medium text-sm text-slate-600">回款管理</span>
                            </a>

                            {/* 报表统计 */}
                            <div className="text-xs text-slate-400 px-4 pt-4 pb-2 uppercase tracking-wider font-semibold">报表统计</div>
                            <a href="statistics.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="bar-chart-3" /> <span className="font-medium text-sm text-slate-600">统计报表</span>
                            </a>
                            <a href="performance.html" className="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl cursor-pointer transition-all">
                                <Icon name="user-circle" /> <span className="font-medium text-sm text-slate-600">个人绩效</span>
                            </a>
                        </nav>

                        <div className="p-4 border-t border-slate-100 mt-auto">
                            <div className="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-xl cursor-pointer">
                                <div className="w-10 h-10 bg-slate-200 rounded-full overflow-hidden">
                                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="avatar" />
                                </div>
                                <div className="flex-1 overflow-hidden">
                                    <p className="text-sm font-semibold text-slate-800 truncate">陈经理</p>
                                    <p className="text-xs text-slate-400 truncate">管理员</p>
                                </div>
                                <Icon name="log-out" className="w-4 h-4 text-slate-400" />
                            </div>
                        </div>
                    </aside>

                    {/* 主体内容区 */}
                    <main className="flex-1 p-8 space-y-6 overflow-y-auto">
                        {/* 顶部标题与操作 */}
                        <div className="flex justify-between items-end">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">我的项目</h1>
                                <p className="text-slate-500 text-sm mt-1">管理您参与的所有项目，跟踪项目进度与验工状态。</p>
                            </div>
                            <div className="flex gap-3">
                                <button className="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-50 transition-all flex items-center gap-2">
                                    <Icon name="upload" className="w-4 h-4" /> 导入
                                </button>
                                <button className="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-50 transition-all flex items-center gap-2">
                                    <Icon name="download" className="w-4 h-4" /> 导出
                                </button>
                                <button className="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all flex items-center gap-2">
                                    <Icon name="plus" className="w-4 h-4" /> 新建项目
                                </button>
                            </div>
                        </div>

                        {/* 筛选标签 */}
                        <div className="flex items-center gap-4">
                            <div className="flex bg-white rounded-xl p-1 shadow-sm border border-slate-100">
                                {[
                                    { key: 'all', label: '全部', count: filterStats.all },
                                    { key: 'inProgress', label: '进行中', count: filterStats.inProgress },
                                    { key: 'pending', label: '待验收', count: filterStats.pending },
                                    { key: 'completed', label: '已完成', count: filterStats.completed },
                                    { key: 'notStarted', label: '未开始', count: filterStats.notStarted },
                                ].map(item => (
                                    <button
                                        key={item.key}
                                        onClick={() => setActiveFilter(item.key)}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${
                                            activeFilter === item.key
                                                ? 'bg-blue-600 text-white shadow-sm'
                                                : 'text-slate-500 hover:text-slate-700'
                                        }`}
                                    >
                                        {item.label}
                                        <span className={`text-xs px-1.5 py-0.5 rounded-full ${
                                            activeFilter === item.key
                                                ? 'bg-blue-500 text-white'
                                                : 'bg-slate-100 text-slate-500'
                                        }`}>{item.count}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1"></div>
                            <div className="relative">
                                <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                <input
                                    type="text"
                                    placeholder="搜索项目名称或编号..."
                                    value={searchText}
                                    onChange={(e) => setSearchText(e.target.value)}
                                    className="pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                            </div>
                        </div>

                        {/* 项目卡片列表 */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                            {filteredProjects.map(project => (
                                <div key={project.id} className="glass-card rounded-2xl p-6 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                                    {/* 头部：分类标签 + 状态 */}
                                    <div className="flex justify-between items-start mb-4">
                                        <span className={`text-xs px-2 py-1 rounded-md border font-medium ${getCategoryStyle(project.category)}`}>
                                            {project.category} · {project.categoryName}
                                        </span>
                                        <span className={`text-xs px-2 py-1 rounded-full font-medium ${getStatusStyle(project.status)}`}>
                                            {project.status}
                                        </span>
                                    </div>

                                    {/* 项目名称 */}
                                    <h3 className="text-base font-semibold text-slate-800 mb-1 group-hover:text-blue-600 transition-colors">
                                        {project.name}
                                    </h3>
                                    <p className="text-xs text-slate-400 mb-4">{project.code}</p>

                                    {/* 阶段进度 */}
                                    <div className="mb-4">
                                        <div className="flex justify-between text-xs text-slate-500 mb-2">
                                            <span>当前阶段：{project.currentPhaseName}</span>
                                            <span>{project.currentPhase}/{project.phases}</span>
                                        </div>
                                        <div className="flex gap-1">
                                            {[...Array(project.phases)].map((_, i) => (
                                                <div
                                                    key={i}
                                                    className={`h-1.5 flex-1 rounded-full transition-all ${
                                                        i < project.currentPhase ? 'bg-blue-500' : 'bg-slate-200'
                                                    }`}
                                                />
                                            ))}
                                        </div>
                                    </div>

                                    {/* 金额与回款 */}
                                    <div className="flex justify-between items-center py-3 border-t border-slate-100">
                                        <div>
                                            <p className="text-xs text-slate-400">合同金额</p>
                                            <p className="text-sm font-semibold text-slate-800">￥{(project.contractAmount / 10000).toFixed(1)}万</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-xs text-slate-400">回款率</p>
                                            <p className={`text-sm font-semibold ${
                                                project.collection >= 80 ? 'text-emerald-600' :
                                                project.collection >= 50 ? 'text-amber-600' : 'text-rose-600'
                                            }`}>{project.collection}%</p>
                                        </div>
                                    </div>

                                    {/* 时间与成员 */}
                                    <div className="flex justify-between items-center pt-3 border-t border-slate-100">
                                        <div className="flex items-center gap-1 text-xs text-slate-400">
                                            <Icon name="calendar" className="w-3 h-3" />
                                            <span>{project.startDate} ~ {project.endDate}</span>
                                        </div>
                                        <div className="flex -space-x-2">
                                            {project.members.slice(0, 3).map((member, idx) => (
                                                <div
                                                    key={idx}
                                                    className="w-6 h-6 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-xs text-slate-600 font-medium"
                                                    title={member}
                                                >
                                                    {member[0]}
                                                </div>
                                            ))}
                                            {project.members.length > 3 && (
                                                <div className="w-6 h-6 rounded-full bg-slate-100 border-2 border-white flex items-center justify-center text-xs text-slate-500">
                                                    +{project.members.length - 3}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* 快捷操作 */}
                                    <div className="flex gap-2 mt-4 pt-4 border-t border-slate-100">
                                        <button className="flex-1 py-2 text-xs text-slate-600 font-medium bg-slate-50 hover:bg-slate-100 rounded-lg transition-colors flex items-center justify-center gap-1">
                                            <Icon name="eye" className="w-3 h-3" /> 查看详情
                                        </button>
                                        {project.status === '进行中' && (
                                            <button className="flex-1 py-2 text-xs text-blue-600 font-medium bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors flex items-center justify-center gap-1">
                                                <Icon name="clipboard-check" className="w-3 h-3" /> 发起验工
                                            </button>
                                        )}
                                        {project.status === '待验收' && (
                                            <button className="flex-1 py-2 text-xs text-amber-600 font-medium bg-amber-50 hover:bg-amber-100 rounded-lg transition-colors flex items-center justify-center gap-1">
                                                <Icon name="clock" className="w-3 h-3" /> 等待审批
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* 空状态 */}
                        {filteredProjects.length === 0 && (
                            <div className="glass-card rounded-2xl p-12 text-center">
                                <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Icon name="folder-open" className="w-8 h-8 text-slate-400" />
                                </div>
                                <h3 className="text-lg font-semibold text-slate-800 mb-2">暂无项目</h3>
                                <p className="text-sm text-slate-500 mb-4">当前筛选条件下没有找到项目</p>
                                <button
                                    onClick={() => { setActiveFilter('all'); setSearchText(''); }}
                                    className="px-4 py-2 text-sm text-blue-600 font-medium hover:bg-blue-50 rounded-lg transition-colors"
                                >
                                    清除筛选条件
                                </button>
                            </div>
                        )}

                        {/* 分页 */}
                        {filteredProjects.length > 0 && (
                            <div className="flex justify-between items-center pt-4">
                                <p className="text-sm text-slate-500">
                                    共 <span className="font-semibold text-slate-800">{filteredProjects.length}</span> 个项目
                                </p>
                                <div className="flex items-center gap-2">
                                    <button className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors disabled:opacity-50" disabled>
                                        <Icon name="chevron-left" className="w-4 h-4" />
                                    </button>
                                    <button className="px-3 py-1.5 text-sm font-medium bg-blue-600 text-white rounded-lg">1</button>
                                    <button className="px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">2</button>
                                    <button className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                                        <Icon name="chevron-right" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
