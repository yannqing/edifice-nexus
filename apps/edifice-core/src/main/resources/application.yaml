app:
  url: ${APP_URL:http://127.0.0.1:8081}
oa:
  url: ${OA_URL:http://127.0.0.1:8080}
  sso-secret: ${OA_SSO_SECRET:edifice-oa-sso-secret-2026}
  sync:
    enabled: ${OA_SYNC_ENABLED:true}
    base-url: ${OA_SYNC_BASE_URL:http://127.0.0.1:8080}
    api-key: ${OA_SYNC_API_KEY:}
    office-database: ${OA_SYNC_OFFICE_DATABASE:office_db}
    default-password: ${OA_SYNC_DEFAULT_PASSWORD:12345678}
    timeout-ms: ${OA_SYNC_TIMEOUT_MS:5000}
    batch-size: ${OA_SYNC_BATCH_SIZE:50}
    max-retry-count: ${OA_SYNC_MAX_RETRY_COUNT:10}
    retry-delay-ms: ${OA_SYNC_RETRY_DELAY_MS:30000}
    full-sync-delay-ms: ${OA_SYNC_FULL_SYNC_DELAY_MS:1800000}
    full-sync-initial-delay-ms: ${OA_SYNC_FULL_SYNC_INITIAL_DELAY_MS:60000}
spring:
  application:
    name: edifice-core
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 20MB       # 单个文件最大 20MB（项目文件场景）
      max-request-size: 50MB    # 整个 multipart 请求最大 50MB（多文件累加 + 表单字段）
  # 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource  # ✅ 显式指定使用Druid
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:edifice_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    druid:
      initial-size: 5          # 根据预期并发调整
      min-idle: 5
      max-active: 20           # 根据最大并发调整
      max-wait: 10000          # 生产环境可缩短到10秒
      filters: stat,wall,log4j2    # 添加日志过滤器
      connection-properties:
        druid.stat.mergeSql=true
        druid.stat.slowSqlMillis=5000
        druid.stat.logSlowSql=true
  # Redis 配置
  data:
    redis:
      database: ${REDIS_DATABASE:1}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 4
          max-wait: 1000ms
          max-idle: 4
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  # 枚举包扫描配置（让 MyBatis-Plus 识别 @EnumValue 注解）
  type-enums-package: com.qsy.edifice.enums
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
      # 字段策略配置
      insert-strategy: not_null # 插入时忽略 null 值字段
      update-strategy: not_null # 更新时忽略 null 值字段


# 日志配置
logging:
  file:
    name: logs/application.log  # 日志文件路径
  level:
    root: INFO                  # 根日志级别
    com.resume.core: INFO       # 项目包日志级别
    org.springframework: WARN   # Spring框架日志级别
    com.baomidou: WARN          # MyBatis-Plus日志级别
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB       # 单个文件最大大小
      max-history: 30           # 保留天数
      file-name-pattern: logs/application-%d{yyyy-MM-dd}.%i.log  # 归档日志文件名模式

knife4j:
  enable: true
  setting:
    language: zh_cn
  basic:
    username: admin
    password: admin123

file:
  upload-common-url: .  # 文件存储一级目录： /yannqing
  upload-prefix-url: /upload  # 1. 请求路径前缀：127.0.0.1:8080/upload/**  2. 文件存储二级目录： /yannqing/upload/**
  upload-image-url: images     # 图片文件存储的三级目录  eg: /yannqing/upload/images/**     对应 url 路径：127.0.0.1:8080/upload/images/**
  upload-document-url: documents   # 文档文件存储的三级目录  eg: /yannqing/upload/documents/**    对应 url 路径：127.0.0.1:8080/upload/documents/**
  upload-audio-url: audios     # 音频文件存储的三级目录  eg: /yannqing/upload/audios/**     对应 url 路径：127.0.0.1:8080/upload/audios/**
  storage-type: local  # 文件存储类型: local(本地存储) 或 cos(微信云托管对象存储)


# JWT配置
jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key_here}  # JWT密钥，生产环境请使用环境变量
  expire-times: ${JWT_EXPIRE_TIMES:604800000}  # Token有效期
