{extend name="../../base/view/common/base" /}
{block name="body"}
<div class="p-page">
    <div class="layui-card border-x border-t" style="margin-bottom:0; box-shadow:0 0 0 0 rgb(5 32 96 / 0%)">
        <div class="body-table layui-tab layui-tab-brief" lay-filter="tab">
            <ul class="layui-tab-title">
                <li class="layui-this">全部</li>
                <li>我申请的</li>
                <li>待我审批</li>
                <li>我已审批</li>
                <li>抄送我的</li>
            </ul>
        </div>
    </div>
    <form class="layui-form gg-form-bar border-x" id="barsearchform">
        <div class="layui-input-inline" style="width:128px">
            <select name="check_status">
                <option value="">审批状态</option>
                {volist name=":get_check_status()" id="status"}
                <option value="{$key}">{$status}</option>
                {/volist}
            </select>
        </div>
        <div class="layui-input-inline" style="width:140px">
            <select name="business_type">
                <option value="">业务类别</option>
                {volist name="$business_types" id="type"}
                <option value="{$type.title}">{$type.title}</option>
                {/volist}
            </select>
        </div>
        <div class="layui-input-inline" style="width:300px">
            <input type="text" name="keywords" placeholder="地点、联系人、电话或说明" class="layui-input" autocomplete="off">
        </div>
        <div class="layui-input-inline" style="width:150px">
            <input type="hidden" name="tab" value="0">
            <button class="layui-btn layui-btn-normal" lay-submit="" lay-filter="table-search"><i class="layui-icon layui-icon-search mr-1"></i>搜索</button>
            <button type="reset" class="layui-btn layui-btn-reset" lay-filter="table-reset">清空</button>
        </div>
    </form>
    <table class="layui-hide" id="table_car_apply" lay-filter="table_car_apply"></table>
</div>

<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm tool-add" type="button" data-href="/adm/carapply/add">+ 用车申请</button>
    </div>
</script>
{/block}

{block name="script"}
<script>
const moduleInit = ['tool', 'tablePlus'];
function gouguInit() {
    var table = layui.tablePlus, tool = layui.tool, element = layui.element;
    element.on('tab(tab)', function (data) {
        $('[name="tab"]').val(data.index);
        $('#barsearchform')[0].reset();
        $('[name="tab"]').val(data.index);
        layui.pageTable.reload({where: {tab: data.index}, page: {curr: 1}});
        return false;
    });

    layui.pageTable = table.render({
        elem: '#table_car_apply',
        toolbar: '#toolbarDemo',
        url: '/adm/carapply/datalist',
        page: true,
        limit: 20,
        cellMinWidth: 70,
        height: 'full-154',
        cols: [[
            {field: 'id', width: 80, title: 'ID号', align: 'center'},
            {field: 'check_status', title: '审批状态', width: 112, align: 'center', templet: function (d) {
                return '<span class="check-status-color-' + d.check_status + '">『' + d.check_status_str + '』</span>';
            }},
            {field: 'start_address', title: '始发地', minWidth: 150},
            {field: 'destination', title: '目的地', minWidth: 150},
            {field: 'use_time', title: '用车时间', width: 280, align: 'center'},
            {field: 'business_type', title: '业务类别', width: 110, align: 'center'},
            {field: 'passenger_count', title: '人数', width: 70, align: 'center'},
            {field: 'contact_name', title: '联系人', width: 90, align: 'center'},
            {field: 'department', title: '所属部门', width: 110, align: 'center'},
            {field: 'admin_name', title: '申请人', width: 90, align: 'center'},
            {field: 'check_user', title: '当前审批人', width: 110, align: 'center'},
            {field: 'create_time', title: '创建时间', width: 150, align: 'center'},
            {width: 120, fixed: 'right', title: '操作', align: 'center', templet: function (d) {
                var viewButton = '<a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="view">详情</a>';
                if ((d.check_status == 0 || d.check_status == 4) && d.admin_id == login_admin) {
                    return '<div class="layui-btn-group">' + viewButton
                        + '<a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>'
                        + '<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a></div>';
                }
                return viewButton;
            }}
        ]]
    });

    table.on('tool(table_car_apply)', function (obj) {
        var data = obj.data;
        if (obj.event === 'view') {
            tool.side('/adm/carapply/view?id=' + data.id);
            return;
        }
        if (obj.event === 'edit') {
            tool.side('/adm/carapply/add?id=' + data.id);
            return;
        }
        if (obj.event === 'del') {
            layer.confirm('确定要删除该用车申请吗？', {icon: 3, title: '提示'}, function (index) {
                tool.delete('/adm/carapply/del', {id: data.id}, function (response) {
                    layer.msg(response.msg);
                    if (response.code === 0) obj.del();
                });
                layer.close(index);
            });
        }
    });
}
</script>
{/block}
