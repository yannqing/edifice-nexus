{extend name="../../base/view/common/base" /}
<!-- 主体 -->
{block name="body"}

<div class="p-page">
	<form class="layui-form gg-form-bar border-t border-x" lay-filter="barsearchform">
		<div class="layui-input-inline" style="width:300px">
			<input type="text" name="keywords" placeholder="关键字" class="layui-input" autocomplete="off" />
		</div>
		<div class="layui-input-inline" style="width:150px">
			<button class="layui-btn layui-btn-normal" lay-submit="" lay-filter="table-search"><i class="layui-icon layui-icon-search mr-1"></i>搜索</button>
			<button type="reset" class="layui-btn layui-btn-reset" lay-filter="table-reset">清空</button>
		</div>
	</form>
	<table class="layui-hide" id="table_attendance_fix" lay-filter="table_attendance_fix"></table>
</div>

<script type="text/html" id="toolbarDemo">
  <div class="layui-btn-group">
  	<button class="layui-btn layui-btn-sm tool-add" type="button" data-href="/home/attendance_fix/add">+ 补卡申请</button>
  </div>
</script>

{/block}
<!-- /主体 -->

<!-- 脚本 -->
{block name="script"}
<script>
	const moduleInit = ['tool','tablePlus'];
	function gouguInit() {
		var table = layui.tablePlus, tool = layui.tool;

		layui.pageTable = table.render({
			elem: "#table_attendance_fix"
			, toolbar: "#toolbarDemo"
			, url: "/home/attendance_fix/datalist"
			, page: true
			, limit: 20
			, cellMinWidth: 80
			, height: 'full-114'
			, cols: [[
				{field:'id', width:80, title: 'ID号', align:'center'}
				,{field:'fix_date_str', title: '补卡日期', width:120, align:'center'}
				,{field:'fix_type_name', title: '补卡类型', width:100, align:'center'}
				,{field:'fix_time', title: '补卡时间', width:100, align:'center'}
				,{field:'reason', title: '补卡原因', minWidth:150}
				,{field:'admin_name', title: '申请人', width:90, align:'center'}
				,{field:'check_status_name', title: '审批状态', width:100, align:'center', templet: function(d){
					var colors = {'待提交审批':'layui-badge-gray','审批中':'layui-badge-blue','审批通过':'layui-badge-green','审批不通过':'layui-badge-red','已撤回':'layui-badge-orange'};
					return '<span class="layui-badge '+(colors[d.check_status_name]||'layui-badge-gray')+'">'+d.check_status_name+'</span>';
				}}
				,{field:'create_time', title: '创建时间', width:160, align:'center', templet: function(d){
					return d.create_time ? new Date(d.create_time*1000).toLocaleString() : '-';
				}}
				,{width:120, fixed:'right', title: '操作', align:'center', ignoreExport:true, templet: function(d){
					var html='';
					var btn1='<a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="view">详细</a>';
					var btn2='<a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>';
					var btn3='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>';
					html = '<div class="layui-btn-group">'+btn1+btn2+btn3+'</div>';
					return html;
				}}
			]]
		});

		table.on('tool(table_attendance_fix)', function (obj) {
			var data = obj.data;
			if (obj.event === 'view') {
				tool.side("/home/attendance_fix/view?id=" + data.id);
				return;
			}
			if (obj.event === 'edit') {
				tool.side("/home/attendance_fix/add?id=" + data.id);
				return;
			}
			if (obj.event === 'del') {
				layer.confirm('确定要删除该内容吗?', { icon: 3, title: '提示' }, function (index) {
					let callback = function (e) {
						layer.msg(e.msg);
						if (e.code == 0) {
							obj.del();
						}
					}
					tool.delete("/home/attendance_fix/del", { id: data.id }, callback);
					layer.close(index);
				});
				return;
			}
		});
	}
</script>
{/block}
<!-- /脚本 -->
