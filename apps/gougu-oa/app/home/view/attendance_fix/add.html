{extend name="../../base/view/common/base" /}
<!-- 主体 -->
{block name="body"}
<form class="layui-form p-page" lay-filter="form-attendance-fix">
	<h3 class="pb-2">补卡申请</h3>
	<table class="layui-table layui-table-form">
		<tr>
			<td class="layui-td-gray-2">补卡日期<font>*</font></td>
			<td><input name="fix_date" class="layui-input tool-time" value="{$detail.fix_date_str|default=''}" readonly lay-verify="required" placeholder="请选择补卡日期" lay-reqText="请选择补卡日期" data-type="date" data-format="yyyy-MM-dd"></td>
			<td class="layui-td-gray">补卡类型<font>*</font></td>
			<td>
				<select name="fix_type" lay-verify="required" lay-reqText="请选择补卡类型">
					<option value="">--请选择--</option>
					{empty name="$detail"}
					<option value="1">上班补卡</option>
					<option value="2">下班补卡</option>
					{else/}
					<option value="1" {eq name="$detail.fix_type" value="1"} selected{/eq}>上班补卡</option>
					<option value="2" {eq name="$detail.fix_type" value="2"} selected{/eq}>下班补卡</option>
					{/empty}
				</select>
			</td>
		</tr>
		<tr>
			<td class="layui-td-gray">补卡时间<font>*</font></td>
			<td><input name="fix_time" class="layui-input tool-time" value="{$detail.fix_time|default=''}" readonly lay-verify="required" placeholder="请选择补卡时间" lay-reqText="请选择补卡时间" data-type="time" data-format="HH:mm"></td>
			<td class="layui-td-gray"></td>
			<td></td>
		</tr>
		<tr>
			<td class="layui-td-gray">补卡原因<font>*</font></td>
			<td colspan="3"><textarea name="reason" placeholder="请填写补卡原因" class="layui-textarea" lay-verify="required" lay-reqText="请填写补卡原因">{$detail.reason|default=''}</textarea></td>
		</tr>
		<tr>
			<td class="layui-td-gray">附件 <button type="button" class="layui-btn layui-btn-xs" id="uploadBtn"><i class="layui-icon"></i></button></td>
			<td colspan="3">
				<div class="layui-row" id="uploadBox">
					<input data-type="file" type="hidden" name="file_ids" value="{$detail.file_ids|default=''}">
					{notempty name="$detail.file_ids"}
					{volist name="$detail.file_array" id="vo"}
					<div class="layui-col-md4">{:file_card($vo)}</div>
					{/volist}
					{/notempty}
				</div>
			</td>
		</tr>
	</table>
	<div id="checkBox" data-status="{$detail.check_status|default=0}" data-id="{$detail.id|default=0}" data-checkflowid="{$detail.check_flow_id|default=0}" class="pt-3"></div>
	<div class="pt-4">
		<input type="hidden" name="id" value="{$detail.id|default=0}">
		<button class="layui-btn layui-btn-normal" lay-submit="" lay-filter="webform">立即提交</button>
		<button type="reset" class="layui-btn layui-btn-primary">重置</button>
	</div>
</form>
{/block}
<!-- /主体 -->

<!-- 脚本 -->
{block name="script"}
<script>
	const moduleInit = ['tool','uploadPlus','oaCheck'];
	function gouguInit() {
		var form = layui.form, tool = layui.tool, uploadPlus = layui.uploadPlus, oaCheck = layui.oaCheck;
		oaCheck.init({
			check_name:'attendance_fix',
			check_btn:0
		});
		var fileUp = new uploadPlus();

		//监听提交
		form.on('submit(webform)', function (data) {
			let callback = function (e) {
				layer.msg(e.msg);
				if (e.code == 0) {
					let checkCallback = function (e) {
						layer.msg(e.msg);
						if (e.code == 0) {
							tool.sideClose(1000);
						}
					}
					data.field.check_name = 'attendance_fix';
					data.field.action_id = e.data.return_id;
					oaCheck.submit(data.field, checkCallback);
				}
			}
			let clickbtn = $(this);
			tool.post("/home/attendance_fix/add", data.field, callback, clickbtn);
			return false;
		});
	}
</script>
{/block}
<!-- /脚本 -->
