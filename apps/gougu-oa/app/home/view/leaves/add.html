{extend name="../../base/view/common/base" /}
<!-- 主体 -->
{block name="body"}
<form class="layui-form p-page" lay-filter="form-leaves">
	<h3 class="pb-2">请假</h3>
	<table class="layui-table layui-table-form">
		<tr>
			<td class="layui-td-gray-2">开始时间<font>*</font></td>
			<td><input name="start_date" class="layui-input tool-time" value="{$detail.start_date|default=''}" readonly lay-verify="required" placeholder="请选择开始时间" lay-reqText="请选择开始时间" data-type="datetime" data-format="yyyy-MM-dd HH:mm"></td>
			<td class="layui-td-gray">结束时间<font>*</font></td>
			<td><input name="end_date" class="layui-input tool-time" value="{$detail.end_date|default=''}" readonly lay-verify="required" placeholder="请选择结束时间" lay-reqText="请选择结束时间" data-type="datetime" data-format="yyyy-MM-dd HH:mm"></td>
		</tr>
		<tr>
			<td class="layui-td-gray">请假天数<font>*</font></td>
			<td><input name="duration" class="layui-input" value="{$detail.duration|default=''}" lay-verify="required|number" placeholder="请输入请假天数" lay-reqText="请输入请假天数"></td>
			<td class="layui-td-gray">请假类型<font>*</font></td>
			<td>
				<select name="types" lay-verify="required" lay-reqText="请选择请假类型">
				  <option value="">--请选择--</option>
				  {volist name=":get_leaves_types(1)" id="vo"}
					{empty name="$detail"}
						<option value="{$vo.id}">{$vo.title}</option>
					{else/}
						<option value="{$vo.id}" {eq name="$detail.types" value="$vo.id"} selected{/eq}>{$vo.title}</option>
					{/empty}
				  {/volist}
				</select>
			</td>
		</tr>
		<tr>
			<td class="layui-td-gray">请假事由<font>*</font></td>
			<td colspan="3"><textarea name="reason" placeholder="请输入请假事由" class="layui-textarea" lay-verify="required" lay-reqText="请输入请假事由">{$detail.reason|default=''}</textarea></td>
		</tr>
		<tr>
			<td class="layui-td-gray">附件 <button type="button" class="layui-btn layui-btn-xs" id="uploadBtn"><i class="layui-icon"></i></button></td>
			<td colspan="3">
				<div class="layui-row" id="uploadBox">
					<input data-type="file" type="hidden" name="file_ids" value="{$detail.file_ids|default=''}">
					{notempty name="$detail.file_ids"}
					{volist name="$detail.file_array" id="vo"}
					<div class="layui-col-md4">{:file_card($vo)}</div>
					{/volist}
					{/notempty}
				</div>
			</td>
		</tr>
	</table>
	<div id="checkBox" data-status="{$detail.check_status|default=0}" data-id="{$detail.id|default=0}" data-checkflowid="{$detail.check_flow_id|default=0}" class="pt-3"></div>
	<div class="pt-4">
		<input type="hidden" name="id" value="{$detail.id|default=0}">
		<button class="layui-btn layui-btn-normal" lay-submit="" lay-filter="webform">立即提交</button>
		<button type="reset" class="layui-btn layui-btn-primary">重置</button>
	</div>
</form>
{/block}
<!-- /主体 -->

<!-- 脚本 -->
{block name="script"}
<script>
	const moduleInit = ['tool','uploadPlus','oaCheck'];
	function gouguInit() {
		var form = layui.form,tool=layui.tool,uploadPlus=layui.uploadPlus,oaCheck=layui.oaCheck;
		oaCheck.init({
			check_name:'leaves',
			check_btn:0
		});	
		var fileUp = new uploadPlus();

		// 自动计算请假天数（1个工作日=8小时，排除周末）
		function calcWorkDays() {
			var startVal = $('input[name="start_date"]').val();
			var endVal = $('input[name="end_date"]').val();
			if (!startVal || !endVal) return;

			var start = new Date(startVal.replace(/-/g, '/'));
			var end = new Date(endVal.replace(/-/g, '/'));
			if (isNaN(start.getTime()) || isNaN(end.getTime())) return;
			if (end <= start) return;

			var totalHours = 0;
			var current = new Date(start);

			while (current < end) {
				var day = current.getDay();
				if (day !== 0 && day !== 6) { // 排除周末
					var dayStart = new Date(current);
					dayStart.setHours(8, 0, 0, 0);
					var dayEnd = new Date(current);
					dayEnd.setHours(17, 0, 0, 0); // 8h工作制: 8:00-12:00 + 13:00-17:00

					var segStart = current > dayStart ? current : dayStart;
					var segEnd = end < dayEnd ? end : dayEnd;

					if (segStart < segEnd) {
						var hours = (segEnd - segStart) / (1000 * 60 * 60);
						// 扣除午休 12:00-13:00
						var noonStart = new Date(current); noonStart.setHours(12, 0, 0, 0);
						var noonEnd = new Date(current); noonEnd.setHours(13, 0, 0, 0);
						if (segStart < noonEnd && segEnd > noonStart) {
							var overlapStart = segStart > noonStart ? segStart : noonStart;
							var overlapEnd = segEnd < noonEnd ? segEnd : noonEnd;
							hours -= (overlapEnd - overlapStart) / (1000 * 60 * 60);
						}
						totalHours += hours;
					}
				}
				// 移到下一天 8:00
				current.setDate(current.getDate() + 1);
				current.setHours(8, 0, 0, 0);
			}

			var days = Math.round(totalHours / 8 * 10) / 10; // 保留1位小数
			if (days > 0) {
				$('input[name="duration"]').val(days);
				form.render('input');
			}
		}

		// 监听日期选择变化（layui laydate 的 done 回调）
		$(document).on('change', 'input[name="start_date"], input[name="end_date"]', function() {
			setTimeout(calcWorkDays, 100);
		});
		// 兼容 laydate 的点击选择
		$('input[name="start_date"], input[name="end_date"]').each(function() {
			var el = this;
			var orig = el.onclick;
			el.addEventListener('click', function() {
				setTimeout(calcWorkDays, 500);
			});
		});

		//监听提交
		form.on('submit(webform)', function (data) {
			let callback = function (e) {
				layer.msg(e.msg);
				if (e.code == 0) {
					let checkCallback = function (e) {
						layer.msg(e.msg);
						if (e.code == 0) {
							tool.sideClose(1000);				
						}
					}
					data.field.check_name = 'leaves';
					data.field.action_id = e.data.return_id;
					oaCheck.submit(data.field,checkCallback);
				}
			}
			let clickbtn = $(this);
			tool.post("/home/leaves/add", data.field, callback,clickbtn);
			return false;
		});
	}
</script>
{/block}
<!-- /脚本 -->
