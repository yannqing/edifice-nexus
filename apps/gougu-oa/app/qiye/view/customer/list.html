{extend name="common/base" /}
{block name="body"}
<div class="mobile-search"><i class="iconfont icon-search"></i><input id="customerKeywords" type="search" placeholder="搜索客户"></div>
<section id="customerList" class="mobile-business-list"></section>
<button id="customerLoadMore" type="button" class="mobile-load-more">加载更多</button>
{/block}
{block name="script"}
<script>
var moduleInit = ['layer'];
function mbuiInit() {
    var page = 1;
    var loading = false;
    var finished = false;
    var timer;
    var $list = $('#customerList');
    var $more = $('#customerLoadMore');

    function escapeHtml(value) {
        return $('<div>').text(value == null ? '' : String(value)).html();
    }

    function load(reset) {
        if (loading || (!reset && finished)) return;
        loading = true;
        if (reset) {
            page = 1;
            finished = false;
            $list.empty();
        }
        $.ajax({
            url: '/qiye/customer/datalist',
            data: {page: page, limit: 15, tab: {$customer_tab}, keywords: $('#customerKeywords').val()},
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        }).done(function (response) {
            var rows = response.data || [];
            rows.forEach(function (item) {
                var contact = item.contact_name
                    ? escapeHtml(item.contact_name) + (item.contact_mobile ? ' · ' + escapeHtml(item.contact_mobile) : '')
                    : '暂无联系人';
                $list.append('<a class="mobile-business-item" href="/qiye/customer/view/id/' + Number(item.id) + '">'
                    + '<div><h2>' + escapeHtml(item.name) + '</h2><p>' + contact + '</p></div>'
                    + '<span>' + escapeHtml(item.belong_name) + '</span><i class="mobile-chevron"></i></a>');
            });
            page += 1;
            finished = rows.length < 15 || $list.children().length >= Number(response.count || 0);
            $more.toggle(!finished);
            if ($list.children().length === 0) {
                $list.html('<div class="mobile-empty"><i class="iconfont icon-none"></i><p>暂无客户</p></div>');
                $more.hide();
            }
        }).fail(function () {
            mbui.layer.msg('客户加载失败');
        }).always(function () {
            loading = false;
        });
    }

    $('#customerKeywords').on('input', function () {
        clearTimeout(timer);
        timer = setTimeout(function () { load(true); }, 350);
    });
    $more.on('click', function () { load(false); });
    load(true);
}
</script>
{/block}
